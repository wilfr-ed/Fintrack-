function getTZ(){return Intl.DateTimeFormat().resolvedOptions().timeZone;}
function nowTZ(tz){return new Date(new Date().toLocaleString("en-US",{timeZone:tz}));}
function fmtDT(iso,tz){if(!iso)return"";try{return new Date(iso).toLocaleString("en-US",{timeZone:tz,month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});}catch{return iso;}}
function tzAbbr(tz){try{return new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"}).formatToParts(new Date()).find(p=>p.type==="timeZoneName")?.value||tz;}catch{return tz;}}
function mKey(iso,tz){if(!iso)return"";try{const d=new Date(new Date(iso).toLocaleString("en-US",{timeZone:tz}));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}catch{return iso.slice(0,7);}}
function ago(iso,tz){const n=nowTZ(tz),t=new Date(iso),d=(n-t)/1000;if(d<60)return"just now";if(d<3600)return`${Math.floor(d/60)}m ago`;if(d<86400)return`${Math.floor(d/3600)}h ago`;if(d<604800)return`${Math.floor(d/86400)}d ago`;return new Date(iso).toLocaleDateString("en-US",{timeZone:tz,month:"short",day:"numeric"});}
function dUntil(d){return Math.ceil((new Date(d)-new Date())/(864e5));}
function mLeft(d){const dd=new Date(d),n=new Date();return Math.max(1,(dd.getFullYear()-n.getFullYear())*12+(dd.getMonth()-n.getMonth()));}

  </svg>;
}

        <div style={{fontSize:10,color:"#334155",marginTop:4,maxWidth:110,textAlign:"right"}}>{tz.replace(/_/g," ")}</div>
      </div>
    </div>
  </div>;
}

function AuthScreen({onAuth}){

  const handle=async()=>{
    setErr("");
    if(!email||!pw){setErr("Fill all fields.");return;}
    if(mode==="signup"&&!name){setErr("Enter your name.");return;}
    if(pw.length<6){setErr("Password min 6 chars.");return;}
    setLoading(true);
    try{
      if(mode==="signup"){
        const r=await authApi("signup",{email,password:pw,data:{name,timezone:tz}});
        if(r.error){setErr(r.error.message);setLoading(false);return;}
        const r2=await authApi("token?grant_type=password",{email,password:pw});
        if(r2.error){setErr("Account created! Please sign in.");setMode("login");setLoading(false);return;}
        await api("profiles",{method:"POST",token:r2.access_token,body:JSON.stringify({id:r2.user.id,name,email,timezone:tz})});
        onAuth(r2.access_token,r2.user,{name,timezone:tz});
      }else{
        const r=await authApi("token?grant_type=password",{email,password:pw});
        if(r.error){setErr("Invalid email or password.");setLoading(false);return;}
        const pr=await api(`profiles?id=eq.${r.user.id}`,{token:r.access_token}).then(x=>x.json());
        onAuth(r.access_token,r.user,pr[0]||{name:email.split("@")[0],timezone:tz});
      }
    }catch(e){setErr("Connection error. Check your internet.");}
    setLoading(false);
  };
  const si={width:"100%",background:"#0d1117",border:"1px solid #1e293b",borderRadius:10,padding:"12px 14px",color:"#e2e8f0",fontSize:14,marginBottom:12,boxSizing:"border-box",outline:"none"};

    <div style={{width:"100%",maxWidth:400,background:"#161b27",border:"1px solid #1e293b",borderRadius:20,padding:"28px 24px"}}>

      {mode==="signup"&&<input style={si} placeholder="Full name" value={name} onChange={e=>setName(e.target.value)}/>}
      <input style={si} placeholder="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/>

        </span>
      </div>
    </div>
  </div>;
}

  const card={background:"#161b27",border:"1px solid #1e293b",borderRadius:16,padding:"16px"};

  const sec={fontSize:11,fontWeight:800,color:"#64748b",letterSpacing:1.5,textTransform:"uppercase",marginBottom:10};
  const hero={margin:"18px 16px 0",background:"linear-gradient(135deg,#1e293b,#0f172a)",border:"1px solid #1e3a5f",borderRadius:20,padding:"22px 20px",position:"relative",overflow:"hidden"};
  const modal={position:"fixed",inset:0,background:"#000000cc",zIndex:300,display:"flex",alignItems:"flex-end",justifyContent:"center"};
  const mBox={background:"#161b27",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:430,border:"1px solid #1e293b"};
  const bCol=(b)=>{const d=dUntil(b.due_date);return d<0?"#ef4444":d<=3?"#f97316":d<=7?"#f59e0b":"#22d3ee";};
  const bLbl=(b)=>{const d=dUntil(b.due_date);return d<0?`${Math.abs(d)}d overdue`:d===0?"Due today!":d===1?"Due tomorrow":`Due in ${d}d`;};

  const tabs=[{id:"dashboard",icon:"⊞",label:"Home"},{id:"bills",icon:"🔔",label:"Bills"},{id:"budget",icon:"💰",label:"Budget"},{id:"expenses",icon:"↓",label:"Expenses"},{id:"ai",icon:"✦",label:"AI"}];

  const insights=[
    urgent.length>0?{icon:"🔔",text:`${urgent.length} bill(s) due within 3 days: ${urgent.map(b=>b.name).join(", ")}.`}:null,
    bStat.filter(b=>b.over).length>0?{icon:"🚨",text:`Over budget: ${bStat.filter(b=>b.over).map(b=>b.cat).join(", ")}.`}:null,
    catT[0]?{icon:"⚠️",text:`Highest spend: ${catT[0].cat} at $${catT[0].value.toFixed(2)}.`}:null,
    tInc>0&&((tInc-tExp)/tInc*100)<20?{icon:"💡",text:`Saving ${((tInc-tExp)/tInc*100).toFixed(0)}% of income. Target 20%+.`}:{icon:"✅",text:`Saving ${tInc>0?((tInc-tExp)/tInc*100).toFixed(0):0}% of income.`},
    {icon:"📈",text:`Weekly avg: $${(tExp/4).toFixed(2)}. Monthly projection: $${tExp.toFixed(2)}.`},
  ].filter(Boolean);

  return <div style={{background:"#0d1117",minHeight:"100vh",color:"#e2e8f0",maxWidth:430,margin:"0 auto",overflowX:"hidden"}}>

    <div style={{padding:"18px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{fontSize:20,fontWeight:900,color:"#fff"}}>Fin<span style={{color:"#22d3ee"}}>Track</span></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {urgent.length>0&&<div style={{background:"#f9731622",border:"1px solid #f9731644",borderRadius:20,padding:"3px 10px",fontSize:11,color:"#f97316",fontWeight:700}}>🔔 {urgent.length}</div>}
        <div style={{fontSize:10,color:"#64748b",background:"#1e293b",padding:"3px 8px",borderRadius:10}}>{tzAbbr(tz)}</div>
        <button onClick={signOut} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:20,padding:"5px 12px",color:"#94a3b8",fontSize:11,fontWeight:700,cursor:"pointer"}}>Sign out</button>
      </div>
    </div>

    {tab==="dashboard"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"16px 16px 0"}}><Clock tz={tz}/></div>
      {urgent.length>0&&<div style={{margin:"12px 16px 0",background:"#f9731618",border:"1px solid #f9731644",borderRadius:14,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#f97316",marginBottom:6}}>🔔 Bills Due Soon</div>
        {urgent.map(b=><div key={b.id} style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,color:"#fed7aa"}}>{b.icon} {b.name}</span><span style={{fontSize:12,fontWeight:700,color:"#f97316"}}>${b.amount} · {bLbl(b)}</span></div>)}
        <button onClick={()=>setTab("bills")} style={{marginTop:8,background:"none",border:"1px solid #f9731644",borderRadius:8,padding:"5px 12px",color:"#f97316",fontSize:11,fontWeight:700,cursor:"pointer"}}>View all →</button>
      </div>}
      {bStat.filter(b=>b.over).length>0&&<div style={{margin:"10px 16px 0",background:"#ef444418",border:"1px solid #ef444444",borderRadius:14,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#ef4444",marginBottom:6}}>🚨 Over Budget</div>
        {bStat.filter(b=>b.over).map(b=><div key={b.cat} style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:12,color:"#fca5a5"}}>{CI[b.cat]} {b.cat}</span><span style={{fontSize:12,fontWeight:700,color:"#ef4444"}}>${b.sp.toFixed(0)}/${b.lim}</span></div>)}
      </div>}
      <div style={hero}>
        <div style={{position:"absolute",top:-40,right:-40,width:140,height:140,background:"radial-gradient(circle,#22d3ee22,transparent 70%)",pointerEvents:"none"}}/>
        <div style={{fontSize:11,color:"#64748b",letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>Total Balance</div>
        <div style={{fontSize:36,fontWeight:900,color:bal>=0?"#22d3ee":"#f87171"}}>${bal.toFixed(2)}</div>
        <div style={{display:"flex",gap:16,marginTop:18}}>
          <div style={{flex:1,background:"#ffffff08",borderRadius:12,padding:"10px 14px"}}><div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1}}>Income</div><div style={{fontSize:18,fontWeight:700,marginTop:2,color:"#4ade80"}}>+${tInc.toFixed(0)}</div></div>
          <div style={{flex:1,background:"#ffffff08",borderRadius:12,padding:"10px 14px"}}><div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1}}>Expenses</div><div style={{fontSize:18,fontWeight:700,marginTop:2,color:"#f87171"}}>-${tExp.toFixed(2)}</div></div>
        </div>
      </div>
      <div style={{margin:"18px 16px 0"}}>
        <div style={sec}>This Month · {MONTHS[lNow.getMonth()]} {lNow.getFullYear()}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[{label:"Earned",val:`$${tmI.toFixed(0)}`,color:"#4ade80",icon:"💰"},{label:"Spent",val:`$${tmE.toFixed(0)}`,color:"#f87171",icon:"💸"},{label:"Bills Due",val:`$${tDue.toFixed(0)}`,color:"#f97316",icon:"🔔"},{label:"Saved",val:`$${(tmI-tmE).toFixed(0)}`,color:"#22d3ee",icon:"🏦"}].map(s=>(
            <div key={s.label} style={{...card,padding:"12px 14px"}}><div style={{fontSize:18,marginBottom:4}}>{s.icon}</div><div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1}}>{s.label}</div><div style={{fontSize:20,fontWeight:800,color:s.color,marginTop:2}}>{s.val}</div></div>
          ))}
        </div>
      </div>
      {goals.length>0&&<div style={{margin:"18px 16px 0"}}>
        <div style={{...sec,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>Goals</span><button onClick={()=>setTab("goals")} style={{background:"none",border:"none",color:"#22d3ee",fontSize:11,fontWeight:700,cursor:"pointer"}}>View all →</button></div>
        <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}}>
          {goals.map(g=>{const pct=g.saved/g.target;return <div key={g.id} onClick={()=>setTab("goals")} style={{minWidth:140,background:"#161b27",border:"1px solid #1e293b",borderRadius:16,padding:"14px",cursor:"pointer",flexShrink:0}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:18}}>{g.icon}</span><div style={{fontSize:12,fontWeight:700,color:"#e2e8f0"}}>{g.name}</div></div>
            <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:6}}><GoalRing pct={pct} size={60} color={pct>=1?"#4ade80":"#a78bfa"}/><div style={{position:"absolute",fontSize:11,fontWeight:800,color:"#f1f5f9"}}>{Math.round(pct*100)}%</div></div>
            <div style={{fontSize:10,color:"#64748b",textAlign:"center"}}>${g.saved.toFixed(0)} / ${g.target.toFixed(0)}</div>
          </div>;})}
        </div>
      </div>}
      <div style={{margin:"18px 16px 0"}}>
        <div style={sec}>AI Insights</div>
        {insights.slice(0,3).map((ins,i)=><div key={i} style={{background:"#161b27",border:"1px solid #1e293b",borderRadius:12,padding:"12px 14px",marginBottom:8,display:"flex",gap:10}}><span style={{fontSize:16}}>{ins.icon}</span><span style={{fontSize:13,color:"#cbd5e1",lineHeight:1.5}}>{ins.text}</span></div>)}
        <button onClick={()=>setTab("ai")} style={{...bOut,marginTop:0}}>Chat with AI Advisor →</button>
      </div>
      <div style={{margin:"18px 16px 0"}}>
        <div style={{...sec,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>Recent Transactions</span><button onClick={()=>setShowExp(true)} style={{background:"linear-gradient(135deg,#22d3ee,#6366f1)",border:"none",borderRadius:20,padding:"5px 12px",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>+ Add</button></div>
        <div style={card}>
          {expenses.length===0?<div style={{textAlign:"center",color:"#334155",padding:"24px 0",fontSize:13}}>No expenses yet. Tap + Add to start.</div>:
          expenses.slice(0,5).map(e=><div key={e.id} style={row}>
            <div style={{width:36,height:36,borderRadius:10,background:CC[e.cat]+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{CI[e.cat]}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.description}</div><div style={{fontSize:10,color:"#64748b",marginTop:1}}>{e.cat} · {ago(e.timestamp,tz)}</div></div>
            <div style={{fontSize:14,fontWeight:700,color:"#f87171",flexShrink:0}}>-${e.amount.toFixed(2)}</div>
          </div>)}
        </div>
      </div>
    </div>}

    {tab==="bills"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"18px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={sec}>Bill Reminders</div><button onClick={()=>setShowBill(true)} style={{background:"linear-gradient(135deg,#f97316,#ef4444)",border:"none",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Add Bill</button></div>
      <div style={{margin:"0 16px 16px",background:"linear-gradient(135deg,#1e293b,#0f172a)",border:"1px solid #1e3a5f",borderRadius:16,padding:"16px 18px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
          {[{label:"Total Due",val:`$${tDue.toFixed(0)}`,color:"#f87171"},{label:"Unpaid",val:unpaid.length,color:"#f97316"},{label:"Urgent",val:urgent.length,color:urgent.length>0?"#ef4444":"#4ade80"}].map(s=><div key={s.label} style={{background:"#ffffff06",borderRadius:10,padding:"10px 12px",textAlign:"center"}}><div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:1}}>{s.label}</div><div style={{fontSize:20,fontWeight:800,color:s.color,marginTop:3}}>{s.val}</div></div>)}
        </div>
      </div>
      <div style={{margin:"0 16px"}}>
        {unpaid.length===0?<div style={{...card,textAlign:"center",padding:"32px 20px",marginBottom:12}}><div style={{fontSize:32,marginBottom:8}}>✅</div><div style={{fontSize:14,fontWeight:700,color:"#4ade80"}}>All bills paid!</div></div>:
        unpaid.map(b=>{const c=bCol(b),d=dUntil(b.due_date);return <div key={b.id} style={{...card,marginBottom:10,border:`1px solid ${d<=3?"#f9731633":"#1e293b"}`}}>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <div style={{width:44,height:44,borderRadius:12,background:c+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{b.icon}</div>
            <div style={{flex:1}}><div style={{fontSize:14,fontWeight:800,color:"#f1f5f9"}}>{b.name}</div><div style={{fontSize:11,color:c,fontWeight:700,marginTop:2}}>{bLbl(b)}</div><div style={{fontSize:10,color:"#64748b",marginTop:1}}>{b.repeat} · {b.due_date}</div></div>
            <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:18,fontWeight:900,color:"#f87171"}}>${b.amount}</div><button onClick={()=>delBill(b.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:11,marginTop:2}}>✕</button></div>
          </div>
          <button onClick={()=>payBill(b.id)} style={{width:"100%",marginTop:12,padding:"9px",background:"#4ade8022",border:"1px solid #4ade8044",borderRadius:10,color:"#4ade80",fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Mark as Paid</button>
        </div>;})}
        {paid.length>0&&<><div style={{...sec,marginTop:16}}>Paid</div>{paid.map(b=><div key={b.id} style={{...card,marginBottom:8,opacity:0.6}}>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <div style={{width:36,height:36,borderRadius:10,background:"#4ade8022",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{b.icon}</div>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:"#94a3b8",textDecoration:"line-through"}}>{b.name}</div><div style={{fontSize:10,color:"#4ade80",marginTop:1}}>✓ Paid {b.paid_at?ago(b.paid_at,tz):""}</div></div>
            <div style={{fontSize:14,fontWeight:700,color:"#4ade80"}}>${b.amount}</div>
            <button onClick={()=>delBill(b.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:14}}>✕</button>
          </div>
        </div>)}</>}
      </div>
    </div>}

    {tab==="budget"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"18px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={sec}>Budget Limits</div><button onClick={()=>{const eb={};budgets.forEach(b=>{eb[b.cat]=b.limit_amount;});setEBudget(eb);setShowBudget(true);}} style={{background:"linear-gradient(135deg,#22d3ee,#6366f1)",border:"none",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>✏ Edit</button></div>
      <div style={{margin:"0 16px"}}>
        {bStat.length===0?<div style={{...card,textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:40,marginBottom:12}}>💰</div><div style={{fontSize:15,fontWeight:700,color:"#e2e8f0",marginBottom:6}}>No budgets set</div><button onClick={()=>{setEBudget({});setShowBudget(true);}} style={{...btn,width:"auto",padding:"10px 24px",marginTop:0}}>Set Limits</button></div>:
        bStat.map(b=>{const rem=b.lim-b.sp;return <div key={b.cat} style={{...card,marginBottom:10,border:`1px solid ${b.over?"#ef444433":b.near?"#f59e0b33":"#1e293b"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:36,height:36,borderRadius:10,background:CC[b.cat]+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{CI[b.cat]}</div>
              <div><div style={{fontSize:14,fontWeight:700,color:"#f1f5f9"}}>{b.cat}</div><div style={{fontSize:10,color:"#64748b"}}>${b.sp.toFixed(0)} of ${b.lim}</div></div>
            </div>
            <div style={{textAlign:"right"}}><div style={{fontSize:16,fontWeight:900,color:b.over?"#ef4444":b.near?"#f59e0b":"#4ade80"}}>{Math.round(b.pct*100)}%</div><div style={{fontSize:10,color:b.over?"#ef4444":"#64748b"}}>{b.over?`$${Math.abs(rem).toFixed(0)} over`:`$${rem.toFixed(0)} left`}</div></div>
          </div>
          <MiniBar value={b.sp} max={b.lim} color={b.over?"#ef4444":b.near?"#f59e0b":"#4ade80"} h={8}/>
          {b.over&&<div style={{fontSize:11,color:"#ef4444",marginTop:6,background:"#ef444411",borderRadius:8,padding:"6px 10px"}}>🚨 Over budget by ${Math.abs(rem).toFixed(2)}</div>}
          {b.near&&!b.over&&<div style={{fontSize:11,color:"#f59e0b",marginTop:6,background:"#f59e0b11",borderRadius:8,padding:"6px 10px"}}>⚡ ${rem.toFixed(2)} remaining</div>}
        </div>;})}
      </div>
    </div>}

    {tab==="expenses"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"18px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={sec}>All Expenses</div><button onClick={()=>setShowExp(true)} style={{background:"linear-gradient(135deg,#22d3ee,#6366f1)",border:"none",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Add</button></div>
      {catT.length>0&&<div style={{margin:"10px 16px 0",display:"flex",gap:6,flexWrap:"wrap"}}>{catT.map(c=><div key={c.cat} style={{padding:"4px 10px",borderRadius:20,background:c.color+"22",border:`1px solid ${c.color}44`,fontSize:11,color:c.color,fontWeight:600}}>{CI[c.cat]} {c.cat} ${c.value.toFixed(0)}</div>)}</div>}
      <div style={{margin:"12px 16px 0"}}>
        <div style={card}>
          {expenses.length===0?<div style={{textAlign:"center",color:"#334155",padding:"32px 0",fontSize:13}}>No expenses yet.</div>:
          expenses.map(e=><div key={e.id} style={row}>
            <div style={{width:36,height:36,borderRadius:10,background:CC[e.cat]+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{CI[e.cat]}</div>
            <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.description}</div><div style={{fontSize:10,color:"#475569",marginTop:1}}>{fmtDT(e.timestamp,tz)}</div></div>
            <div style={{fontSize:14,fontWeight:700,color:"#f87171",marginRight:6,flexShrink:0}}>-${e.amount.toFixed(2)}</div>
            <button onClick={()=>delExp(e.id)} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:14}}>✕</button>
          </div>)}
        </div>
      </div>
    </div>}

    {tab==="goals"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"18px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={sec}>Savings Goals</div><button onClick={()=>setShowGoal(true)} style={{background:"linear-gradient(135deg,#a78bfa,#6366f1)",border:"none",borderRadius:20,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>+ New</button></div>
      <div style={{margin:"0 16px"}}>
        {goals.length===0?<div style={{...card,textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:40,marginBottom:12}}>🎯</div><div style={{fontSize:15,fontWeight:700,color:"#e2e8f0",marginBottom:6}}>No goals yet</div><button onClick={()=>setShowGoal(true)} style={{...btn,width:"auto",padding:"10px 24px",marginTop:0}}>Create Goal</button></div>:
        goals.map(g=>{const pct=g.saved/g.target,dl=Math.max(0,Math.ceil((new Date(g.deadline)-new Date())/864e5)),done=pct>=1;return <div key={g.id} style={{...card,marginBottom:12,position:"relative"}}>
          <button onClick={()=>delGoal(g.id)} style={{position:"absolute",top:12,right:12,background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:14}}>✕</button>
          <div style={{display:"flex",gap:14,alignItems:"center"}}>
            <div style={{position:"relative",flexShrink:0}}><GoalRing pct={pct} size={80} color={done?"#4ade80":"#a78bfa"}/><div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:22}}>{g.icon}</span></div></div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:800,color:"#f1f5f9",marginBottom:2}}>{g.name}</div>
              <div style={{fontSize:12,color:"#64748b",marginBottom:6}}>{done?"🎉 Goal reached!":`${dl} days left · ${Math.round(pct*100)}% done`}</div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:12,color:"#a78bfa",fontWeight:700}}>${g.saved.toFixed(0)} saved</span><span style={{fontSize:12,color:"#64748b"}}>of ${g.target.toFixed(0)}</span></div>
              <div style={{background:"#1a1f2e",borderRadius:4,height:6,overflow:"hidden"}}><div style={{width:`${Math.min(pct*100,100)}%`,height:"100%",background:done?"linear-gradient(90deg,#4ade80,#22d3ee)":"linear-gradient(90deg,#a78bfa,#6366f1)",borderRadius:4}}/></div>
              {!done&&<div style={{fontSize:11,color:"#64748b",marginTop:4}}>Save ${((g.target-g.saved)/Math.max(mLeft(g.deadline),1)).toFixed(0)}/mo to reach goal</div>}
            </div>
          </div>
          {!done&&<button onClick={()=>{setShowSavings(g.id);setAddAmt("");}} style={{width:"100%",marginTop:14,padding:"9px",background:"#a78bfa22",border:"1px solid #a78bfa44",borderRadius:10,color:"#a78bfa",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Add Savings</button>}
          {done&&<div style={{marginTop:12,padding:"10px",background:"#4ade8022",border:"1px solid #4ade8044",borderRadius:10,textAlign:"center",fontSize:13,color:"#4ade80",fontWeight:700}}>🎉 Goal complete!</div>}
        </div>;})}
      </div>
    </div>}

    {tab==="ai"&&<div style={{paddingBottom:100}}>
      <div style={{margin:"18px 16px 0"}}>
        <div style={sec}>AI Financial Advisor</div>
        <div style={{...card,marginBottom:12}}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:8,fontWeight:700,letterSpacing:1}}>QUICK INSIGHTS</div>
          {insights.map((ins,i)=><div key={i} style={{background:"#0d1117",borderRadius:10,padding:"10px 12px",marginBottom:6,display:"flex",gap:10}}><span style={{fontSize:14}}>{ins.icon}</span><span style={{fontSize:12,color:"#cbd5e1",lineHeight:1.5}}>{ins.text}</span></div>)}
        </div>
        <div style={card}>
          <div style={{fontSize:11,color:"#64748b",marginBottom:10,fontWeight:700,letterSpacing:1}}>CHAT WITH FINTRACK AI</div>
          <div ref={chatRef} style={{height:280,overflowY:"auto",padding:"4px 0"}}>
            {aiChat.length===0&&<div style={{textAlign:"center",color:"#334155",padding:"30px 0"}}><div style={{fontSize:28,marginBottom:8}}>✦</div><div style={{fontSize:13,color:"#475569"}}>Ask me anything about your finances</div><div style={{fontSize:11,marginTop:8,color:"#1e293b",lineHeight:1.8}}>"How can I save more?"<br/>"Am I over budget?"<br/>"Which bills are urgent?"</div></div>}
            {aiChat.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:10}}><div style={{maxWidth:"82%",padding:"10px 14px",borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",background:m.role==="user"?"linear-gradient(135deg,#22d3ee,#6366f1)":"#1e293b",fontSize:13,lineHeight:1.5,color:"#f1f5f9"}}>{m.text}</div></div>)}
            {aiLoading&&<div style={{display:"flex",justifyContent:"flex-start",marginBottom:10}}><div style={{padding:"10px 14px",borderRadius:"16px 16px 16px 4px",background:"#1e293b",fontSize:13,color:"#64748b"}}>Analyzing...</div></div>}
          </div>
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <input style={{flex:1,background:"#0d1117",border:"1px solid #1e293b",borderRadius:10,padding:"10px 14px",color:"#e2e8f0",fontSize:13,outline:"none"}} value={aiInput} onChange={e=>setAiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&askAI()} placeholder="Ask your AI advisor..."/>
            <button onClick={askAI} style={{width:40,height:40,borderRadius:10,background:"linear-gradient(135deg,#22d3ee,#6366f1)",border:"none",color:"#fff",fontSize:16,cursor:"pointer"}}>→</button>
          </div>
        </div>
      </div>
    </div>}

    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#0d1117",borderTop:"1px solid #1e293b",display:"flex",zIndex:200}}>
      {tabs.map(t=><button key={t.id} style={{flex:1,padding:"12px 0 14px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative"}} onClick={()=>setTab(t.id)}>
        {t.id==="bills"&&urgent.length>0&&<div style={{position:"absolute",top:8,right:"50%",marginRight:-18,width:8,height:8,borderRadius:"50%",background:"#f97316"}}/>}
        <span style={{fontSize:18,opacity:tab===t.id?1:0.3}}>{t.icon}</span>
        <span style={{fontSize:9,letterSpacing:0.5,textTransform:"uppercase",fontWeight:700,color:tab===t.id?"#22d3ee":"#475569"}}>{t.label}</span>
      </button>)}
    </div>

    {showExp&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowExp(false)}>
      <div style={mBox}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"#f1f5f9"}}>Add Expense</div>
        <div style={{fontSize:11,color:"#22d3ee",marginBottom:14}}>🕐 {fmtDT(new Date().toISOString(),tz)} · {tzAbbr(tz)}</div>
        <input style={inp} placeholder="Description" value={nExp.description} onChange={e=>setNExp(p=>({...p,description:e.target.value}))}/>
        <input style={inp} placeholder="Amount ($)" type="number" value={nExp.amount} onChange={e=>setNExp(p=>({...p,amount:e.target.value}))}/>
        <select style={inp} value={nExp.cat} onChange={e=>setNExp(p=>({...p,cat:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        <button style={btn} onClick={addExp}>Save Expense</button>
        <button style={bOut} onClick={()=>setShowExp(false)}>Cancel</button>
      </div>
    </div>}

    {showInc&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowInc(false)}>
      <div style={mBox}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"#f1f5f9"}}>Add Income</div>
        <div style={{fontSize:11,color:"#4ade80",marginBottom:14}}>🕐 {fmtDT(new Date().toISOString(),tz)} · {tzAbbr(tz)}</div>
        <input style={inp} placeholder="Description" value={nInc.description} onChange={e=>setNInc(p=>({...p,description:e.target.value}))}/>
        <input style={inp} placeholder="Amount ($)" type="number" value={nInc.amount} onChange={e=>setNInc(p=>({...p,amount:e.target.value}))}/>
        <select style={inp} value={nInc.source} onChange={e=>setNInc(p=>({...p,source:e.target.value}))}>{SRCS.map(s=><option key={s}>{s}</option>)}</select>
        <button style={{...btn,background:"linear-gradient(135deg,#4ade80,#22d3ee)",color:"#0d1117"}} onClick={addInc}>Save Income</button>
        <button style={bOut} onClick={()=>setShowInc(false)}>Cancel</button>
      </div>
    </div>}

    {showGoal&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowGoal(false)}>
      <div style={mBox}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#f1f5f9"}}>New Savings Goal</div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:"#64748b",marginBottom:6,fontWeight:600}}>ICON</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{GOAL_ICONS.map(ic=><button key={ic} onClick={()=>setNGoal(p=>({...p,icon:ic}))} style={{width:36,height:36,borderRadius:10,border:`2px solid ${nGoal.icon===ic?"#a78bfa":"#1e293b"}`,background:nGoal.icon===ic?"#a78bfa22":"#0d1117",fontSize:18,cursor:"pointer"}}>{ic}</button>)}</div></div>
        <input style={inp} placeholder="Goal name" value={nGoal.name} onChange={e=>setNGoal(p=>({...p,name:e.target.value}))}/>
        <input style={inp} placeholder="Target ($)" type="number" value={nGoal.target} onChange={e=>setNGoal(p=>({...p,target:e.target.value}))}/>
        <input style={inp} placeholder="Already saved ($)" type="number" value={nGoal.saved} onChange={e=>setNGoal(p=>({...p,saved:e.target.value}))}/>
        <div style={{fontSize:11,color:"#64748b",marginBottom:6,fontWeight:600}}>DEADLINE</div>
        <input style={inp} type="date" value={nGoal.deadline} onChange={e=>setNGoal(p=>({...p,deadline:e.target.value}))}/>
        <button style={{...btn,background:"linear-gradient(135deg,#a78bfa,#6366f1)"}} onClick={addGoal}>Create Goal</button>
        <button style={bOut} onClick={()=>setShowGoal(false)}>Cancel</button>
      </div>
    </div>}

    {showBill&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowBill(false)}>
      <div style={mBox}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#f1f5f9"}}>Add Bill Reminder</div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:"#64748b",marginBottom:6,fontWeight:600}}>ICON</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{BILL_ICONS.map(ic=><button key={ic} onClick={()=>setNBill(p=>({...p,icon:ic}))} style={{width:36,height:36,borderRadius:10,border:`2px solid ${nBill.icon===ic?"#f97316":"#1e293b"}`,background:nBill.icon===ic?"#f9731622":"#0d1117",fontSize:18,cursor:"pointer"}}>{ic}</button>)}</div></div>
        <input style={inp} placeholder="Bill name" value={nBill.name} onChange={e=>setNBill(p=>({...p,name:e.target.value}))}/>
        <input style={inp} placeholder="Amount ($)" type="number" value={nBill.amount} onChange={e=>setNBill(p=>({...p,amount:e.target.value}))}/>
        <div style={{fontSize:11,color:"#64748b",marginBottom:6,fontWeight:600}}>DUE DATE</div>
        <input style={inp} type="date" value={nBill.due_date} onChange={e=>setNBill(p=>({...p,due_date:e.target.value}))}/>
        <select style={inp} value={nBill.repeat} onChange={e=>setNBill(p=>({...p,repeat:e.target.value}))}>{["Once","Weekly","Monthly","Yearly"].map(r=><option key={r}>{r}</option>)}</select>
        <select style={inp} value={nBill.cat} onChange={e=>setNBill(p=>({...p,cat:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        <button style={{...btn,background:"linear-gradient(135deg,#f97316,#ef4444)"}} onClick={addBill}>Add Bill</button>
        <button style={bOut} onClick={()=>setShowBill(false)}>Cancel</button>
      </div>
    </div>}

    {showBudget&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowBudget(false)}>
      <div style={{...mBox,maxHeight:"80vh",overflowY:"auto"}}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"#f1f5f9"}}>Set Budget Limits</div>
        <div style={{fontSize:12,color:"#64748b",marginBottom:16}}>Monthly spending limits per category.</div>
        {CATS.map(c=><div key={c} style={{marginBottom:10}}><div style={{fontSize:11,color:"#94a3b8",marginBottom:4,fontWeight:600}}>{CI[c]} {c}</div><input style={inp} placeholder={`${c} limit ($)`} type="number" value={eBudget[c]||""} onChange={e=>setEBudget(p=>({...p,[c]:e.target.value}))}/></div>)}
        <button style={btn} onClick={saveBudgets}>Save Limits</button>
        <button style={bOut} onClick={()=>setShowBudget(false)}>Cancel</button>
      </div>
    </div>}

    {showSavings&&<div style={modal} onClick={e=>e.target===e.currentTarget&&setShowSavings(null)}>
      <div style={mBox}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:16,color:"#f1f5f9"}}>{goals.find(g=>g.id===showSavings)?.icon} Add to {goals.find(g=>g.id===showSavings)?.name}</div>
        <input style={inp} placeholder="Amount ($)" type="number" value={addAmt} onChange={e=>setAddAmt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveToGoal(showSavings)}/>
        <button style={{...btn,background:"linear-gradient(135deg,#a78bfa,#6366f1)"}} onClick={()=>saveToGoal(showSavings)}>Add Savings</button>
        <button style={bOut} onClick={()=>setShowSavings(null)}>Cancel</button>
      </div>
    </div>}
  </div>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
